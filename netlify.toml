[build]
  publish = "public"
  functions = "netlify/functions"
[build.environment]
  NODE_VERSION = "24"
[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/migrations/*.sql"]
  external_node_modules = ["pg", "cheerio", "google-auth-library", "@aws-sdk/client-s3"]
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "no-referrer"


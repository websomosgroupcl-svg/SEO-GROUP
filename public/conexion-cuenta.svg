<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 200" role="img" aria-labelledby="title desc">
  <title id="title">La cuenta que leerá los datos del sitio</title>
  <desc id="desc">Ilustración. En Google Cloud, IAM y administración, Cuentas de servicio, localiza el correo de la cuenta. Invita ese correo desde la propiedad de Google.</desc>
  <rect width="480" height="200" rx="14" fill="#f3f3f3"/>
  <g font-family="Arial,sans-serif">
    <rect x="20" y="18" width="440" height="146" rx="10" fill="#fff" stroke="#c5c5cb"/>
    <rect x="20" y="18" width="440" height="34" rx="10" fill="#4f4f57"/>
    <rect x="20" y="42" width="440" height="10" fill="#4f4f57"/>
    <text x="36" y="40" font-size="14" fill="white">Google Cloud  /  IAM y administración</text>
    <text x="38" y="79" font-size="18" font-weight="bold" fill="#303035">Cuentas de servicio</text>
    <text x="38" y="101" font-size="13" fill="#63636e">Elige la cuenta de esta instalación</text>
    <rect x="36" y="112" width="408" height="37" rx="6" fill="#f3f3f3" stroke="#7a7a87"/>
    <text x="46" y="135" font-size="15" font-weight="bold" fill="#4f4f57">Correo de la cuenta de servicio</text>
    <path d="M405 130h25m-8-7 8 7-8 7" fill="none" stroke="#737380" stroke-width="2.5"/>
    <text x="25" y="187" font-size="13" fill="#4c4c53">Ese correo recibe los permisos de lectura.</text>
  </g>
</svg>
